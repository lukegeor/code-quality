name: Build, Pack & Publish

'on':
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish (e.g. 1.0.1). Leave empty to use project default or git tag."
        required: false
        type: string

jobs:
  build-test-publish:
    name: Build, Test & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine Version
        id: version_step
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "Building specified version: ${{ github.event.inputs.version }}"
            echo "VERSION_ARG=-p:Version=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF#refs/tags/v}"
            echo "Building git tag version: ${TAG_VER}"
            echo "VERSION_ARG=-p:Version=${TAG_VER}" >> $GITHUB_ENV
          else
            echo "Using project default version"
            echo "VERSION_ARG=" >> $GITHUB_ENV
          fi

      - name: Restore Dependencies
        run: dotnet restore CodeQuality.slnx

      - name: Build Solution
        run: dotnet build CodeQuality.slnx --no-restore -c Release ${{ env.VERSION_ARG }}

      - name: Run Tests
        run: dotnet test CodeQuality.slnx --no-build -c Release --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Pack Solution
        run: dotnet pack CodeQuality.slnx --no-build -c Release ${{ env.VERSION_ARG }} -o ./artifacts

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts/*.nupkg
          if-no-files-found: error

      - name: Publish to GitHub Packages
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate
